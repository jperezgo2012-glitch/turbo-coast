<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Turbo Coast</title>
<style>
  html,body{margin:0;height:100%;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{width:min(100vw,160vh);aspect-ratio:8/5;image-rendering:pixelated;background:#000;touch-action:none}
</style>
</head>
<body>
<canvas id="c" width="640" height="400"></canvas>
<script>
'use strict';
/* =====================  TURBO COAST  =====================
   Carreras pseudo-3D estilo arcade clásico.
   Controles: flechas / WASD  (arriba = acelerar, abajo = frenar)
   Espacio/Enter = empezar, M = silenciar
   ======================================================== */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 640, H = 400;
const STEP = 1/60;

// --- parámetros de la carretera / cámara ---
const roadWidth = 2000, segLen = 200, rumbleLen = 3, lanes = 4;
const camH = 1000, drawDist = 250, fov = 100;
const camDepth = 1/Math.tan((fov/2)*Math.PI/180);
const playerZ = camH*camDepth;
const maxSpeed = segLen/STEP;
const ACCEL = maxSpeed/5, BRAKING = -maxSpeed, DECEL = -maxSpeed/5;
const OFF_DECEL = -maxSpeed/2, OFF_LIMIT = maxSpeed/4, CENTRIFUGAL = 0.3;
const CAR_W = 0.27;            // ancho de coche (en semianchos de carretera)

// --- utilidades ---
const rnd = (a,b)=>a+Math.random()*(b-a);
const limit = (v,a,b)=>Math.max(a,Math.min(v,b));
const lerp = (a,b,p)=>a+(b-a)*p;
const easeIn = (a,b,p)=>a+(b-a)*p*p;
const easeInOut = (a,b,p)=>a+(b-a)*(-Math.cos(p*Math.PI)/2+0.5);
const incr = (s,inc,max)=>{ let r=s+inc; while(r>=max) r-=max; while(r<0) r+=max; return r; };
const pctRem = (n,total)=>(n%total)/total;
const overlap = (x1,w1,x2,w2)=>Math.abs(x1-x2)<(w1+w2)/2;

// --- circuito ---
let segments = [], trackLength = 0, cars = [];
const lastY = ()=>segments.length ? segments[segments.length-1].p2.world.y : 0;

function addSegment(curve,y){
  const n = segments.length;
  segments.push({
    index:n,
    p1:{world:{y:lastY(),z:n*segLen},camera:{},screen:{}},
    p2:{world:{y:y,z:(n+1)*segLen},camera:{},screen:{}},
    curve, sprites:[], cars:[], clip:0, looped:false
  });
}
function addRoad(enter,hold,leave,curve,y){
  const startY = lastY(), endY = startY + Math.trunc(y)*segLen, total = enter+hold+leave;
  for(let n=0;n<enter;n++) addSegment(easeIn(0,curve,n/enter), easeInOut(startY,endY,n/total));
  for(let n=0;n<hold;n++)  addSegment(curve, easeInOut(startY,endY,(enter+n)/total));
  for(let n=0;n<leave;n++) addSegment(easeInOut(curve,0,n/leave), easeInOut(startY,endY,(enter+hold+n)/total));
}
const LEN = {S:25, M:50, L:100}, CUR = {E:2, M:4, H:6}, HIL = {L:20, M:40, H:60};
const aStraight = n=>addRoad(n,n,n,0,0);
const aHill = (n,h)=>addRoad(n,n,n,0,h);
const aCurve = (n,c,h=0)=>addRoad(n,n,n,c,h);

const SPR = {
  palm:{w:0.55, ratio:2.4, hit:0.25},
  rock:{w:0.40, ratio:0.65, hit:0.35},
  sign:{w:0.90, ratio:0.75, hit:0.55},
  tree:{w:0.60, ratio:1.7, hit:0.25},
  cactus:{w:0.40, ratio:1.8, hit:0.2},
  bld:{w:1.10, ratio:2.2, hit:0.95},
  gate:{w:2.40, ratio:0.50, hit:0}
};

function buildTrack(){
  segments = [];
  const pieces = [
    ()=>aHill(LEN.M,HIL.L), ()=>aCurve(LEN.M,CUR.E,0), ()=>aStraight(LEN.S), ()=>aCurve(LEN.M,-CUR.M,-HIL.L),
    ()=>aCurve(LEN.L,CUR.M,HIL.M), ()=>aHill(LEN.M,-HIL.M), ()=>aCurve(LEN.M,-CUR.H,HIL.L), ()=>aHill(LEN.L,HIL.H),
    ()=>aCurve(LEN.M,CUR.H,-HIL.H), ()=>aCurve(LEN.M,-CUR.E,0), ()=>aHill(LEN.S,HIL.M), ()=>aCurve(LEN.M,CUR.M,0)
  ];
  let order = [], pi = 0;
  const nextPiece = ()=>{
    if(pi%pieces.length===0){ order = pieces.slice().sort(()=>Math.random()-0.5); }
    order[pi++%pieces.length]();
  };
  // por cada ciudad: 3 o 4 tramos de carretera de campo y luego la ciudad
  ZONES = [];
  aStraight(LEN.S);
  for(let k=0;k<CITIES.length;k++){
    const start = k===0 ? 0 : segments.length;
    const n = 3 + (Math.random()<0.5?1:0);
    for(let j=0;j<n;j++) nextPiece();
    const cityStart = segments.length;
    aStraight(LEN.L);
    aCurve(LEN.M, k%2?CUR.E:-CUR.E, 0);
    ZONES.push({start, cityStart, end:segments.length});
  }
  addRoad(LEN.S, LEN.S, LEN.S, 0, -lastY()/segLen);   // vuelve a y=0 para cerrar el bucle
  trackLength = segments.length*segLen;
  ZMAP = []; CMAP = [];
  const lastEnd = ZONES[ZONES.length-1].end;
  for(let i=0;i<segments.length;i++){
    let k = ZONES.findIndex(z=>i<z.end); if(k<0) k=0;
    ZMAP.push(k); CMAP.push(i<lastEnd && i>=ZONES[k].cityStart);
  }

  // decorado
  for(let n=8;n<segments.length-8; n+=2+Math.floor(Math.random()*4)){
    const ci = zoneOf(n), city = CMAP[n], tropical = ci>=3;
    for(const side of [-1,1]){
      if(Math.random()<(city?0.25:0.4)) continue;
      const r = Math.random();
      let s;
      if(city){
        if(r<(tropical?0.45:0.8)) s={type:'bld', offset:side*rnd(1.75,2.3), ci, seed:Math.floor(rnd(0,1000)), ratio:rnd(1.3,3.4)};
        else if(tropical && r<0.85) s={type:'palm', offset:side*rnd(1.35,2.0)};
        else s={type:'sign', offset:side*rnd(1.35,2.0)};
      } else {
        const nat = ci===2 ? 'cactus' : (tropical ? 'palm' : 'tree');
        if(r<0.65) s={type:nat, offset:side*rnd(1.35,3.2)};
        else if(r<0.88) s={type:'rock', offset:side*rnd(1.35,3.2)};
        else s={type:'sign', offset:side*rnd(1.35,2.2)};
      }
      segments[n].sprites.push(s);
    }
  }
  // puerta de checkpoint a la entrada de cada ciudad
  for(const z of ZONES) segments[z.cityStart+3].sprites = [{type:'gate', offset:0}];
}

const LANE_X = [-0.75,-0.25,0.25,0.75];
const LANE_SPD = [0.20,0.27,0.34,0.42];
const CAR_COLORS = ['#2aa7ff','#ffd400','#f2f2f2','#a24bff','#22cc66','#ff8a00','#00d9c0'];
function buildCars(){
  for(const s of segments) s.cars.length = 0;
  cars = [];
  for(let l=0;l<4;l++){
    let z = segLen*rnd(40,80);
    while(z < trackLength-segLen*30){
      const car = {offset:LANE_X[l], z, speed:maxSpeed*LANE_SPD[l], color:CAR_COLORS[Math.floor(Math.random()*CAR_COLORS.length)], w:CAR_W};
      cars.push(car);
      findSeg(z).cars.push(car);
      z += segLen*rnd(22,70);
    }
  }
}
const findSeg = z => segments[Math.floor(z/segLen) % segments.length];

// --- ciudades de EE. UU. (una por tramo del circuito) ---
const CITIES = [
  {name:'NUEVA YORK', style:'ny',    grass:['#3d8f4a','#368443'], sky:['#161a4a','#5b4a9c','#f2a06a'], sun:false, stars:true,  far:'#2b2a5a', near:'#1a1838', win:'#ffd86b'},
  {name:'CHICAGO',    style:'chi',   grass:['#3a9a55','#328d4c'], sky:['#1a2a5c','#4c78b8','#f7c88a'], sun:true,  stars:false, far:'#4a6a90', near:'#243a58', win:'#ffe9a0'},
  {name:'LAS VEGAS',  style:'vegas', grass:['#d9a15a','#cc944e'], sky:['#07041f','#3b1065','#c2306f'], sun:false, stars:true,  far:'#4a1d5e', near:'#240b3c', win:'#ff7ad9'},
  {name:'LOS ÁNGELES',style:'la',    grass:['#c9b25e','#bda553'], sky:['#2a1a6e','#d9468f','#ffb35c'], sun:true,  stars:false, far:'#8a4a7a', near:'#5a3366', win:'#ffe08a'},
  {name:'MIAMI',      style:'miami', grass:['#efce82','#e3c06f'], sky:['#1f6fd1','#ff7eb6','#ffd27a'], sun:true,  stars:false, far:'#e8a0c8', near:'#5fc4b8', win:'#fff2a0'}
];
const BLD_PAL = [
  ['#3a3a5c','#4a4470','#2e2f4f'], ['#2e4560','#3f5a7a','#26384e'], ['#552266','#7a2d66','#3a1a55'],
  ['#c9a27e','#e0b890','#d8a0a0'], ['#ff9ec7','#7fe0d6','#ffe27a']
];
const NEON = ['#ff2fd6','#2ff4ff','#ffe92f'];
let ZONES = [], ZMAP = [], CMAP = [];          // tramos por ciudad, ciudad de cada segmento, ¿está dentro de la ciudad?
const zoneOf = idx => ZMAP[idx];
const isCity = idx => CMAP[idx];

// skyline de fondo (generado una vez, periódico para poder desplazarlo)
const SKY_P = 960;
function mulberry(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return((t^t>>>14)>>>0)/4294967296; }; }
function genSkyline(ci,far){
  const st = CITIES[ci].style, r = mulberry(ci*97+(far?13:0)+5);
  const [hmin,hmax] = {ny:[40,110],chi:[45,115],vegas:[20,80],la:[12,42],miami:[14,50]}[st];
  const k = far?0.55:1, arr=[]; let x=0,i=0;
  while(x<SKY_P){
    const w = Math.floor(r()*26+(far?22:16)), h = Math.floor((hmin+r()*(hmax-hmin))*k);
    arr.push({x, w:Math.min(w,SKY_P-x), h, i:i++, cap:Math.floor(r()*3)});
    x += w+(far?0:Math.floor(r()*4));
  }
  return arr;
}
const SKY = CITIES.map((c,ci)=>({far:genSkyline(ci,true), near:genSkyline(ci,false)}));
const STARS = (()=>{ const r=mulberry(77), a=[]; for(let i=0;i<60;i++) a.push([r()*W, r()*(H/2-40)]); return a; })();

// --- estado del juego ---
let state = 'title';           // title | play | over
let position=0, speed=0, playerX=0, time=60, score=0, lastCp=0, shake=0, skyOff=0, lastZone=-1;
let hi = 0; try{ hi = +localStorage.getItem('turbocoast_hi')||0; }catch(e){}
let msg = {text:'', t:0}, overT = 0, steerVis = 0, tick = 0;
const keys = {};

function resetGame(){
  buildCars();
  position=0; speed=0; playerX=0; time=60; score=0; lastCp=0; shake=0; overT=0; lastZone=-1;
  state='play';
  showMsg('¡ARRANCA!',1.4);
}
function showMsg(t,d){ msg.text=t; msg.t=d; }

// --- sonido ---
let ac=null, osc=null, gain=null, muted=false;
function initAudio(){
  if(ac) return;
  try{
    ac = new (window.AudioContext||window.webkitAudioContext)();
    osc = ac.createOscillator(); osc.type='sawtooth';
    const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=700;
    gain = ac.createGain(); gain.gain.value=0;
    osc.connect(lp); lp.connect(gain); gain.connect(ac.destination);
    osc.start();
  }catch(e){ ac=null; }
}
function beep(f,d,type='square',v=0.06){
  if(!ac||muted) return;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.value=f; g.gain.value=v;
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+d);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+d);
}
function crashSound(){ beep(90,0.25,'sawtooth',0.12); beep(55,0.35,'square',0.08); }

// --- entrada ---
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if(e.code==='KeyM'){ muted=!muted; }
  if(e.code==='Space'||e.code==='Enter') startPressed();
});
function startPressed(){
  initAudio(); if(ac&&ac.state==='suspended') ac.resume();
  if(state==='title' || (state==='over' && overT>1.2)) resetGame();
}
addEventListener('keyup',e=>{ keys[e.code]=false; });
const kLeft=()=>keys.ArrowLeft||keys.KeyA, kRight=()=>keys.ArrowRight||keys.KeyD;
const kUp=()=>keys.ArrowUp||keys.KeyW, kDown=()=>keys.ArrowDown||keys.KeyS||keys.KeyZ;

// --- lógica ---
function update(dt){
  tick += dt;
  const pSeg = findSeg(position+playerZ);
  const sp = speed/maxSpeed;

  // tráfico
  for(const car of cars){
    const old = findSeg(car.z);
    car.z = incr(car.z, dt*car.speed, trackLength);
    const nw = findSeg(car.z);
    if(old!==nw){ old.cars.splice(old.cars.indexOf(car),1); nw.cars.push(car); }
  }
  if(shake>0) shake = Math.max(0, shake-dt*1.5);
  if(msg.t>0) msg.t-=dt;

  if(state==='title'){
    speed = maxSpeed*0.5;
    position = incr(position, dt*speed, trackLength);
    playerX = Math.sin(position/9000)*0.4;
    skyOff += pSeg.curve*0.5*dt*90;
    return;
  }

  const ctl = state==='play';
  const dx = dt*2*sp;
  const L = ctl&&kLeft(), R = ctl&&kRight();
  position = incr(position, dt*speed, trackLength);

  if(L) playerX -= dx; else if(R) playerX += dx;
  steerVis = lerp(steerVis, L?-1:(R?1:0), 0.2);
  playerX -= dx*sp*pSeg.curve*CENTRIFUGAL;

  if(ctl&&kUp()) speed += ACCEL*dt;
  else if(ctl&&kDown()) speed += BRAKING*dt;
  else speed += (state==='over'?DECEL*2:DECEL)*dt;

  if((playerX<-1||playerX>1)){
    if(speed>OFF_LIMIT) speed += OFF_DECEL*dt;
    for(const s of pSeg.sprites){
      const T = SPR[s.type]; if(!T.hit) continue;
      if(overlap(playerX, CAR_W, s.offset, T.hit)){
        speed = maxSpeed/5;
        playerX = s.offset>0 ? s.offset-(T.hit+CAR_W)/2-0.03 : s.offset+(T.hit+CAR_W)/2+0.03;
        shake = 0.5; crashSound();
        break;
      }
    }
  }
  for(const car of pSeg.cars){
    if(speed>car.speed && overlap(playerX, CAR_W, car.offset, car.w)){
      speed = car.speed*0.55;
      position = incr(car.z, -playerZ, trackLength);
      shake = 0.6; crashSound();
      break;
    }
  }
  playerX = limit(playerX,-3,3);
  speed = limit(speed,0,maxSpeed);
  skyOff += pSeg.curve*sp*dt*90;

  if(state==='play'){
    score += speed*dt/60;
    time -= dt;
    const zi = zoneOf(pSeg.index), inC = isCity(pSeg.index), key = zi*2+(inC?1:0);
    if(key!==lastZone){
      if(inC){
        time += 20; showMsg('BIENVENIDO A '+CITIES[zi].name+'  +20s',2.8);
        beep(880,0.15); setTimeout(()=>beep(1175,0.25),140);
      } else showMsg('RUMBO A '+CITIES[zi].name,2.5);
      lastZone = key;
    }
    if(time<=0){
      time=0; state='over'; overT=0; showMsg('',0);
      if(score>hi){ hi=Math.floor(score); try{localStorage.setItem('turbocoast_hi',hi);}catch(e){} }
    }
  } else overT += dt;

  if(osc){
    const g = Math.floor(sp*4.999), within = (sp*4.999)%1;
    osc.frequency.value = 55 + g*18 + within*110;
    gain.gain.value = muted?0:(0.035+sp*0.03);
  }
}

// --- dibujo ---
function poly(x1,y1,x2,y2,x3,y3,x4,y4,c){
  ctx.fillStyle=c; ctx.beginPath();
  ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.lineTo(x4,y4);
  ctx.closePath(); ctx.fill();
}
function txt(s,x,y,size,color,align='left'){
  ctx.font = `bold ${size}px "Arial Black",Impact,sans-serif`;
  ctx.textAlign=align; ctx.textBaseline='top';
  ctx.lineWidth=Math.max(2,size/5); ctx.lineJoin='round'; ctx.strokeStyle='#000';
  ctx.strokeText(s,x,y); ctx.fillStyle=color; ctx.fillText(s,x,y);
}
function project(p,camX,camY,camZ){
  p.camera.x = (p.world.x||0)-camX;
  p.camera.y = p.world.y-camY;
  p.camera.z = p.world.z-camZ;
  p.screen.scale = camDepth/p.camera.z;
  p.screen.x = Math.round(W/2 + p.screen.scale*p.camera.x*W/2);
  p.screen.y = Math.round(H/2 - p.screen.scale*p.camera.y*H/2);
  p.screen.w = Math.round(p.screen.scale*roadWidth*W/2);
}

function drawSegment(x1,y1,w1,x2,y2,w2,idx){
  const dark = Math.floor(idx/rumbleLen)%2===1;
  ctx.fillStyle = CITIES[zoneOf(idx)].grass[dark?1:0];
  ctx.fillRect(0,y2,W,y1-y2);
  const r1 = w1/Math.max(6,2*lanes), r2 = w2/Math.max(6,2*lanes);
  const rc = dark?'#f4f4f4':'#d4202a';
  poly(x1-w1-r1,y1,x1-w1,y1,x2-w2,y2,x2-w2-r2,y2,rc);
  poly(x1+w1+r1,y1,x1+w1,y1,x2+w2,y2,x2+w2+r2,y2,rc);
  poly(x1-w1,y1,x1+w1,y1,x2+w2,y2,x2-w2,y2, dark?'#585862':'#5f5f69');
  if(!dark){
    const l1 = w1/Math.max(32,8*lanes), l2 = w2/Math.max(32,8*lanes);
    const lw1 = w1*2/lanes, lw2 = w2*2/lanes;
    let lx1 = x1-w1+lw1, lx2 = x2-w2+lw2;
    for(let l=1;l<lanes;l++,lx1+=lw1,lx2+=lw2)
      poly(lx1-l1/2,y1,lx1+l1/2,y1,lx2+l2/2,y2,lx2-l2/2,y2,'#e8e8e8');
  }
}

function ridge(off,amp,freqs,color,base){
  ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(0,base);
  for(let x=0;x<=W;x+=4){
    const u=(x+off)/960*Math.PI*2; let h=0;
    for(const f of freqs) h+=f[1]*Math.sin(f[0]*u+f[2]);
    ctx.lineTo(x,base-amp-h);
  }
  ctx.lineTo(W,base); ctx.closePath(); ctx.fill();
}
// capa de edificios del fondo; `lit` = con ventanas animadas
function drawSkyline(list,off,color,base,winColor,lit){
  for(const b of list){
    const bx = ((b.x-off)%SKY_P+SKY_P)%SKY_P;
    for(const x of [bx,bx-SKY_P]){
      if(x>W||x+b.w<0) continue;
      const top = base-b.h;
      ctx.fillStyle=color; ctx.fillRect(x,top,b.w,b.h);
      if(b.cap===1) ctx.fillRect(x+b.w*0.25,top-8,b.w*0.5,8);
      if(b.cap===2){
        ctx.fillRect(x+b.w/2-1,top-14,2,14);
        if(lit && Math.floor(tick*1.5+b.i)%2===0){ ctx.fillStyle='#ff3030'; ctx.fillRect(x+b.w/2-1.5,top-16,3,3); }
      }
      if(lit){
        ctx.fillStyle=winColor;
        const cols=Math.floor((b.w-2)/5), rows=Math.floor((b.h-4)/7);
        for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
          const hv=(b.i*73+r*31+c*17)%7;
          if(hv<3 || (hv===3 && Math.floor(tick*2+b.i+r)%2===0)) ctx.fillRect(x+2+c*5, top+4+r*7, 2, 3);
        }
      }
    }
  }
}
// monumento característico de cada ciudad (se desplaza más lento que los edificios)
function drawLandmark(ci,off){
  const st=CITIES[ci].style, base=H/2+4;
  const xs=((480-off)%SKY_P+SKY_P)%SKY_P;
  for(const x of [xs,xs-SKY_P]){
    if(x<-160||x>W+160) continue;
    if(st==='ny'){            // tipo Empire State, con luces de colores
      ctx.fillStyle='#0f0e26';
      ctx.fillRect(x-14,base-150,28,150); ctx.fillRect(x-9,base-175,18,25); ctx.fillRect(x-5,base-192,10,17); ctx.fillRect(x-1,base-215,2,23);
      ctx.fillStyle=['#ff4a4a','#4aa0ff','#ffd040'][Math.floor(tick/1.5)%3]; ctx.globalAlpha=0.85;
      ctx.fillRect(x-5,base-192,10,17); ctx.fillRect(x-9,base-175,18,6); ctx.globalAlpha=1;
      if(Math.floor(tick*2)%2===0){ ctx.fillStyle='#ff3030'; ctx.fillRect(x-1.5,base-218,3,3); }
    } else if(st==='chi'){    // tipo Torre Willis
      ctx.fillStyle='#0f1c2e';
      for(const c of [[-18,10,130],[-8,10,170],[2,10,150],[12,10,110]]) ctx.fillRect(x+c[0],base-c[2],c[1],c[2]);
      ctx.fillRect(x-6,base-210,2,40); ctx.fillRect(x+2,base-205,2,35);
      if(Math.floor(tick*2)%2===0){ ctx.fillStyle='#ff3030'; ctx.fillRect(x-6.5,base-213,3,3); ctx.fillRect(x+1.5,base-208,3,3); }
    } else if(st==='vegas'){  // tipo Stratosphere + focos giratorios
      ctx.fillStyle='#14062a'; ctx.fillRect(x-2,base-170,4,170);
      ctx.beginPath(); ctx.ellipse(x,base-150,16,5,0,0,Math.PI*2); ctx.fill();
      ctx.fillRect(x-1,base-190,2,22);
      ctx.fillStyle=NEON[Math.floor(tick*3)%3]; ctx.fillRect(x-15,base-151,30,2);
      for(let k=0;k<2;k++){
        const a=Math.sin(tick*0.9+k*2.5)*0.7, sx=x+(k?70:-70), ex=sx+Math.sin(a)*170;
        ctx.fillStyle='rgba(255,255,210,0.16)';
        ctx.beginPath(); ctx.moveTo(sx-3,base); ctx.lineTo(sx+3,base); ctx.lineTo(ex+16,base-210); ctx.lineTo(ex-16,base-210); ctx.fill();
      }
    } else if(st==='la'){     // colina con letrero tipo Hollywood
      ctx.fillStyle='#6a3b6a'; ctx.beginPath(); ctx.moveTo(x-170,base); ctx.quadraticCurveTo(x-60,base-80,x,base-62); ctx.quadraticCurveTo(x+90,base-45,x+170,base); ctx.fill();
      ctx.font='bold 9px Arial'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
      ctx.fillStyle='rgba(255,255,255,'+(0.75+0.25*Math.sin(tick*2))+')'; ctx.fillText('H O L L Y W O O D',x,base-52);
    } else {                  // Miami: torre art déco con neón
      ctx.fillStyle='#d98ab8'; ctx.fillRect(x-22,base-105,44,105); ctx.fillRect(x-14,base-125,28,20);
      for(let k=0;k<4;k++){
        ctx.fillStyle=NEON[(k+Math.floor(tick*2))%3]; ctx.globalAlpha=0.6+0.4*Math.sin(tick*4+k);
        ctx.fillRect(x-22,base-95+k*22,44,3);
      }
      ctx.globalAlpha=1;
    }
  }
}
function drawBg(pSeg){
  const ci=zoneOf(pSeg.index), c=CITIES[ci], base=H/2+4;
  const g = ctx.createLinearGradient(0,0,0,H/2);
  g.addColorStop(0,c.sky[0]); g.addColorStop(0.55,c.sky[1]); g.addColorStop(1,c.sky[2]);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H/2+2);
  if(c.stars){
    ctx.fillStyle='#fff';
    STARS.forEach((s,i)=>{ ctx.globalAlpha=0.45+0.45*Math.sin(tick*3+i*1.7); ctx.fillRect(s[0],s[1],1.5,1.5); });
    ctx.globalAlpha=1;
  }
  if(c.sun){
    const sg = ctx.createLinearGradient(0,H/2-95,0,H/2);
    sg.addColorStop(0,'#fff27a'); sg.addColorStop(1,'#ff4f9a');
    ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(W*0.68-(skyOff*0.05)%40,H/2-14,52,0,Math.PI*2); ctx.fill();
  }
  // avioneta cruzando el cielo
  const px = W+40-((tick*28)%(W+120)), py = 38+6*Math.sin(tick*0.7);
  ctx.fillStyle='#ddd'; ctx.fillRect(px-8,py,16,3); ctx.fillRect(px-3,py-3,6,9);
  if(Math.floor(tick*2)%2===0){ ctx.fillStyle='#ff3030'; ctx.fillRect(px+8,py,2,2); }
  if(isCity(pSeg.index)){
    drawSkyline(SKY[ci].far,skyOff*0.4,c.far,base,null,false);
    drawLandmark(ci,skyOff*0.65);
    drawSkyline(SKY[ci].near,skyOff*0.9,c.near,base,c.win,true);
  } else {
    // campo abierto: colinas; al acercarse a la ciudad asoma su skyline a lo lejos
    ridge(skyOff*0.4,24,[[2,12,0],[5,7,1],[9,4,2]],c.far,base);
    if(ZONES[ci].cityStart-pSeg.index < 450) drawSkyline(SKY[ci].far,skyOff*0.4,c.far,base,null,false);
    ridge(skyOff*0.9,12,[[3,8,2],[7,4,0],[11,3,1]],c.near,base);
  }
  ctx.fillStyle = c.grass[0];
  ctx.fillRect(0,H/2+3,W,H/2);
}

// edificio junto a la carretera, con ventanas y neones animados
function drawBld(cx,y,w,s){
  const c=CITIES[s.ci], h=w*s.ratio, col=BLD_PAL[s.ci][s.seed%3];
  ctx.fillStyle=col; ctx.fillRect(cx-w/2,y-h,w,h);
  ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fillRect(cx+w*0.2,y-h,w*0.3,h);
  ctx.fillStyle='rgba(255,255,255,.2)'; ctx.fillRect(cx-w/2,y-h,w,Math.max(1,h*0.02));
  if(w>16){
    const rows=Math.floor(h/(w*0.2))-1, ww=w*0.12, wh=w*0.09;
    for(let r=0;r<rows;r++) for(let k=0;k<4;k++){
      const hv=(s.seed+r*31+k*17)%7;
      ctx.fillStyle=(hv<3||(hv===3&&Math.floor(tick*2+s.seed+r)%2===0))?c.win:'rgba(0,0,0,.35)';
      ctx.fillRect(cx-w/2+w*0.1+k*w*0.22, y-h+w*0.1+r*w*0.2, ww, wh);
    }
  }
  if(c.style==='vegas'||c.style==='miami'||(c.style==='ny'&&s.seed%3===0)){
    const nc=NEON[s.seed%3];
    ctx.globalAlpha=Math.sin(tick*5+s.seed)>-0.3 ? 0.9 : 0.25;
    ctx.fillStyle=nc; ctx.fillRect(cx-w*0.4,y-h*0.5,w*0.8,Math.max(2,w*0.1));
    ctx.globalAlpha=0.25; ctx.fillRect(cx-w*0.46,y-h*0.5-w*0.04,w*0.92,Math.max(2,w*0.18));
    ctx.globalAlpha=1;
  }
}

// coche visto por detrás
function drawCar(cx,by,w,c,spoiler,tilt){
  ctx.save();
  ctx.translate(cx,by); ctx.rotate(tilt||0); ctx.translate(-cx,-by);
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(cx,by,w*0.56,w*0.09,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#111';
  ctx.fillRect(cx-w*0.5,by-w*0.3,w*0.16,w*0.3); ctx.fillRect(cx+w*0.34,by-w*0.3,w*0.16,w*0.3);
  ctx.fillStyle=c; ctx.fillRect(cx-w*0.46,by-w*0.4,w*0.92,w*0.26);
  poly(cx-w*0.34,by-w*0.4, cx-w*0.22,by-w*0.62, cx+w*0.22,by-w*0.62, cx+w*0.34,by-w*0.4, c);
  poly(cx-w*0.28,by-w*0.42, cx-w*0.19,by-w*0.58, cx+w*0.19,by-w*0.58, cx+w*0.28,by-w*0.42, '#16264a');
  ctx.fillStyle='#ff2a2a';
  ctx.fillRect(cx-w*0.44,by-w*0.37,w*0.2,w*0.08); ctx.fillRect(cx+w*0.24,by-w*0.37,w*0.2,w*0.08);
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(cx-w*0.46,by-w*0.2,w*0.92,w*0.07);
  ctx.fillStyle='#eee'; ctx.fillRect(cx-w*0.09,by-w*0.3,w*0.18,w*0.07);
  if(spoiler){
    ctx.fillStyle='#222'; ctx.fillRect(cx-w*0.4,by-w*0.68,w*0.8,w*0.06);
    ctx.fillRect(cx-w*0.36,by-w*0.64,w*0.05,w*0.12); ctx.fillRect(cx+w*0.31,by-w*0.64,w*0.05,w*0.12);
  }
  ctx.restore();
}
// descapotable rojo visto por detrás: él (pelo moreno) y ella (rubia, pelo al viento)
function drawConvertible(cx,by,w,tilt,sp){
  ctx.save();
  ctx.translate(cx,by); ctx.rotate(tilt); ctx.translate(-cx,-by);
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(cx,by,w*0.56,w*0.09,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#111';
  ctx.fillRect(cx-w*0.5,by-w*0.3,w*0.16,w*0.3); ctx.fillRect(cx+w*0.34,by-w*0.3,w*0.16,w*0.3);
  // parabrisas
  ctx.fillStyle='#222'; ctx.fillRect(cx-w*0.38,by-w*0.64,w*0.76,w*0.07);
  ctx.fillStyle='rgba(150,210,255,.9)'; ctx.fillRect(cx-w*0.35,by-w*0.62,w*0.7,w*0.04);
  // asientos
  ctx.fillStyle='#f1e3c8';
  ctx.fillRect(cx-w*0.38,by-w*0.56,w*0.34,w*0.2); ctx.fillRect(cx+w*0.04,by-w*0.56,w*0.34,w*0.2);
  const mx=cx-w*0.21, fx=cx+w*0.21, hr=w*0.085;
  const wind = 0.3+sp;
  // él
  ctx.fillStyle='#2f6fd6'; ctx.fillRect(mx-w*0.11,by-w*0.56,w*0.22,w*0.15);
  ctx.fillStyle='#e0a878'; ctx.fillRect(mx-w*0.03,by-w*0.6,w*0.06,w*0.05);
  ctx.fillStyle='#e0a878'; ctx.beginPath(); ctx.arc(mx-hr,by-w*0.67,w*0.02,0,7); ctx.arc(mx+hr,by-w*0.67,w*0.02,0,7); ctx.fill();
  ctx.fillStyle='#2a1a10'; ctx.beginPath(); ctx.arc(mx,by-w*0.68,hr,0,Math.PI*2); ctx.fill();
  ctx.fillRect(mx-hr*0.9,by-w*0.68,hr*1.8,hr*0.5);
  // ella
  ctx.fillStyle='#ff7ab8'; ctx.fillRect(fx-w*0.1,by-w*0.56,w*0.2,w*0.14);
  ctx.fillStyle='#f0c09a'; ctx.fillRect(fx-w*0.03,by-w*0.6,w*0.06,w*0.05);
  ctx.fillStyle='#ffd75a';
  ctx.beginPath(); ctx.arc(fx,by-w*0.68,hr*1.15,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(fx+Math.sin(tick*6)*w*0.01*wind,by-w*0.6,hr*1.25,w*0.1,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#ffe27a'; ctx.lineWidth=Math.max(1,w*0.03); ctx.lineCap='round';
  for(let i=0;i<4;i++){
    const o=(i-1.5);
    ctx.beginPath(); ctx.moveTo(fx+o*w*0.04,by-w*0.7);
    ctx.quadraticCurveTo(fx+o*w*0.09+Math.sin(tick*9+i*2)*w*0.05*wind, by-w*0.58,
                         fx+o*w*0.13+Math.sin(tick*11+i)*w*0.08*wind, by-w*0.46+Math.cos(tick*7+i)*w*0.02);
    ctx.stroke();
  }
  // carrocería trasera
  ctx.fillStyle='#e8202c'; ctx.fillRect(cx-w*0.46,by-w*0.4,w*0.92,w*0.26);
  poly(cx-w*0.44,by-w*0.4, cx-w*0.38,by-w*0.46, cx+w*0.38,by-w*0.46, cx+w*0.44,by-w*0.4, '#ff3a46');
  ctx.fillStyle='#ff2a2a';
  ctx.fillRect(cx-w*0.44,by-w*0.37,w*0.2,w*0.08); ctx.fillRect(cx+w*0.24,by-w*0.37,w*0.2,w*0.08);
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(cx-w*0.46,by-w*0.2,w*0.92,w*0.07);
  ctx.fillStyle='#eee'; ctx.fillRect(cx-w*0.09,by-w*0.3,w*0.18,w*0.07);
  ctx.restore();
}
function drawPalm(cx,y,w){
  const h=w*2.4, tx=cx+w*0.05, ty=y-h*0.9;
  ctx.lineCap='round';
  ctx.strokeStyle='#7a4a22'; ctx.lineWidth=Math.max(1,w*0.11);
  ctx.beginPath(); ctx.moveTo(cx,y); ctx.quadraticCurveTo(cx+w*0.14,y-h*0.5,tx,ty); ctx.stroke();
  ctx.strokeStyle='#1c9a3c'; ctx.lineWidth=Math.max(1,w*0.1);
  const Lf=w*0.55;
  for(const a of [-3.0,-2.4,-1.85,-1.3,-0.75,-0.15]){
    ctx.beginPath(); ctx.moveTo(tx,ty);
    ctx.quadraticCurveTo(tx+Math.cos(a)*Lf*0.5, ty+Math.sin(a)*Lf*0.8-w*0.05, tx+Math.cos(a)*Lf, ty+Math.sin(a)*Lf*0.2+Lf*0.35);
    ctx.stroke();
  }
  ctx.fillStyle='#5a3a18'; ctx.beginPath(); ctx.arc(tx,ty+w*0.04,w*0.07,0,Math.PI*2); ctx.fill();
}
function drawRock(cx,y,w){
  const h=w*0.65;
  ctx.fillStyle='#8a7f86'; ctx.beginPath();
  ctx.moveTo(cx-w/2,y); ctx.lineTo(cx-w*0.38,y-h*0.7); ctx.lineTo(cx-w*0.1,y-h);
  ctx.lineTo(cx+w*0.3,y-h*0.8); ctx.lineTo(cx+w/2,y); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.2)'; ctx.beginPath();
  ctx.moveTo(cx-w*0.1,y-h); ctx.lineTo(cx+w*0.3,y-h*0.8); ctx.lineTo(cx+w*0.05,y-h*0.45); ctx.lineTo(cx-w*0.25,y-h*0.7); ctx.fill();
}
function drawSign(cx,y,w){
  const h=w*0.75;
  ctx.fillStyle='#333';
  ctx.fillRect(cx-w*0.38,y-h*0.7,w*0.05,h*0.7); ctx.fillRect(cx+w*0.33,y-h*0.7,w*0.05,h*0.7);
  ctx.fillStyle='#fff'; ctx.fillRect(cx-w/2,y-h,w,h*0.5);
  ctx.fillStyle='#e8212c'; ctx.fillRect(cx-w/2,y-h,w,h*0.15);
  ctx.fillStyle='#1d5cff'; ctx.fillRect(cx-w/2,y-h*0.65,w,h*0.15);
}
function drawGate(cx,y,w){
  const h=w*0.5;
  ctx.fillStyle='#ddd';
  ctx.fillRect(cx-w*0.49,y-h,w*0.04,h); ctx.fillRect(cx+w*0.45,y-h,w*0.04,h);
  ctx.fillStyle='#e8212c'; ctx.fillRect(cx-w/2,y-h,w,h*0.24);
  ctx.fillStyle='#fff'; ctx.fillRect(cx-w/2,y-h+h*0.24,w,h*0.04);
  if(w>150){
    ctx.font=`bold ${h*0.15}px "Arial Black",sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#fff'; ctx.fillText('CHECKPOINT',cx,y-h+h*0.12);
  }
}
function drawTree(cx,y,w){
  const h=w*1.7;
  ctx.fillStyle='#6b4423'; ctx.fillRect(cx-w*0.06,y-h*0.45,w*0.12,h*0.45);
  ctx.fillStyle='#1f7a35'; ctx.beginPath(); ctx.arc(cx,y-h*0.62,w*0.34,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#2a9a45'; ctx.beginPath(); ctx.arc(cx-w*0.12,y-h*0.72,w*0.24,0,Math.PI*2); ctx.arc(cx+w*0.14,y-h*0.78,w*0.2,0,Math.PI*2); ctx.fill();
}
function drawCactus(cx,y,w){
  const h=w*1.8;
  ctx.fillStyle='#2f8f4a';
  ctx.fillRect(cx-w*0.12,y-h,w*0.24,h);
  ctx.fillRect(cx-w*0.42,y-h*0.6,w*0.3,w*0.12); ctx.fillRect(cx-w*0.42,y-h*0.78,w*0.12,h*0.2);
  ctx.fillRect(cx+w*0.12,y-h*0.45,w*0.3,w*0.12); ctx.fillRect(cx+w*0.30,y-h*0.64,w*0.12,h*0.2);
}
const DRAW = {palm:drawPalm, rock:drawRock, sign:drawSign, gate:drawGate, bld:drawBld, tree:drawTree, cactus:drawCactus};

function render(){
  const baseSeg = findSeg(position), basePct = pctRem(position,segLen);
  const pSeg = findSeg(position+playerZ), pPct = pctRem(position+playerZ,segLen);
  const playerY = lerp(pSeg.p1.world.y,pSeg.p2.world.y,pPct);
  let maxy=H, x=0, dx=-(baseSeg.curve*basePct);

  ctx.save();
  if(shake>0) ctx.translate(rnd(-1,1)*shake*8, rnd(-1,1)*shake*8);
  drawBg(pSeg);

  for(let n=0;n<drawDist;n++){
    const seg = segments[(baseSeg.index+n)%segments.length];
    seg.looped = seg.index<baseSeg.index;
    seg.clip = maxy;
    const cz = position-(seg.looped?trackLength:0);
    project(seg.p1, playerX*roadWidth-x,    playerY+camH, cz);
    project(seg.p2, playerX*roadWidth-x-dx, playerY+camH, cz);
    x+=dx; dx+=seg.curve;
    if(seg.p1.camera.z<=camDepth || seg.p2.screen.y>=seg.p1.screen.y || seg.p2.screen.y>=maxy) continue;
    drawSegment(seg.p1.screen.x,seg.p1.screen.y,seg.p1.screen.w, seg.p2.screen.x,seg.p2.screen.y,seg.p2.screen.w, seg.index);
    maxy = seg.p1.screen.y;
  }

  const sp = speed/maxSpeed;
  for(let n=drawDist-1;n>=0;n--){
    const seg = segments[(baseSeg.index+n)%segments.length];
    const visible = seg.p1.camera.z>camDepth;
    if(visible){
      for(const car of seg.cars){
        const pc = pctRem(car.z,segLen);
        const sw = lerp(seg.p1.screen.w,seg.p2.screen.w,pc);
        const sx = lerp(seg.p1.screen.x,seg.p2.screen.x,pc) + car.offset*sw;
        const sy = lerp(seg.p1.screen.y,seg.p2.screen.y,pc);
        const dw = car.w*sw;
        if(dw<2 || sy-dw*0.7>=seg.clip) continue;
        const clipIt = sy>seg.clip;
        if(clipIt){ ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,seg.clip); ctx.clip(); }
        drawCar(sx,sy,dw,car.color,false,0);
        if(clipIt) ctx.restore();
      }
      for(const s of seg.sprites){
        const T = SPR[s.type];
        const sw = seg.p1.screen.w, sx = seg.p1.screen.x + s.offset*sw, sy = seg.p1.screen.y;
        const dw = T.w*sw;
        if(dw<3 || sy-dw*(s.ratio||T.ratio)>=seg.clip) continue;
        const clipIt = sy>seg.clip;
        if(clipIt){ ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,seg.clip); ctx.clip(); }
        DRAW[s.type](sx,sy,dw,s);
        if(clipIt) ctx.restore();
      }
    }
    if(seg===pSeg){
      const ps = camDepth/playerZ;
      const py = H/2 - ps*lerp(pSeg.p1.camera.y,pSeg.p2.camera.y,pPct)*H/2;
      const pw = CAR_W*ps*roadWidth*W/2;
      const off = (playerX<-1||playerX>1)?2.5:1;
      const bounce = (state!=='title' && speed>0) ? rnd(-1,1)*1.2*sp*off : 0;
      drawConvertible(W/2, py-10+bounce, pw, state==='title'?0:steerVis*0.05*sp, sp);
    }
  }
  ctx.restore();
  drawHud();
}

function drawHud(){
  if(state==='title'){
    txt('TURBO COAST',W/2,70,54,'#ffd23a','center');
    txt('PULSA ESPACIO PARA EMPEZAR',W/2,170,20,(Math.floor(tick*2)%2)?'#fff':'#ff7ab8','center');
    txt('↑ acelerar   ↓/Z frenar   ← → girar   M sonido',W/2,330,14,'#fff','center');
    if(hi) txt('RÉCORD '+hi,W/2,356,14,'#9ff','center');
    return;
  }
  txt('PUNTOS',14,8,12,'#ffd23a'); txt(String(Math.floor(score)).padStart(7,'0'),14,22,20,'#fff');
  txt('RÉCORD',W-14,8,12,'#ffd23a','right'); txt(String(hi).padStart(7,'0'),W-14,22,20,'#fff','right');
  txt('TIEMPO',W/2,6,12,'#ffd23a','center');
  const low = time<10 && state==='play';
  txt(String(Math.ceil(time)).padStart(2,'0'),W/2,18,38,(low&&Math.floor(tick*4)%2)?'#ff3030':'#fff','center');
  txt(Math.round(speed/maxSpeed*330)+' km/h',W-14,H-34,24,'#fff','right');
  { const ps=findSeg(position+playerZ), nm=CITIES[zoneOf(ps.index)].name;
    txt(isCity(ps.index)?nm:'RUMBO A '+nm,14,H-30,18,'#ffd23a'); }
  if(msg.t>0 && msg.text) txt(msg.text,W/2,120,30,'#ffd23a','center');
  if(state==='over'){
    txt('GAME OVER',W/2,110,52,'#ff4a4a','center');
    txt('PUNTUACIÓN '+Math.floor(score),W/2,180,22,'#fff','center');
    if(overT>1.2) txt('ESPACIO PARA REINTENTAR',W/2,230,18,(Math.floor(tick*2)%2)?'#fff':'#ff7ab8','center');
  }
}

// --- bucle principal ---
buildTrack();
buildCars();
let last = performance.now(), acc = 0;
function frame(now){
  acc += Math.min(1,(now-last)/1000); last = now;
  while(acc>STEP){ update(STEP); acc-=STEP; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
